  // --- MAC TRACKPAD & MOUSE NAVIGATION ---
  let isPanning = false; let panStartX = 0, panStartY = 0;

  window.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('gesturechange', (e) => e.preventDefault());
  window.addEventListener('gestureend', (e) => e.preventDefault());

  stage.addEventListener('mousedown', (e) => {
    if(e.button === 1) e.preventDefault(); 
    const isOverInteractive = e.target.closest('button, input, select, .tile, .artboard-header');
    
    if (!isOverInteractive) {
      const ab = getActiveArtboard();
      if (ab) {
        ab.selectedTileIndex = null;
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('is-selected'));
        syncContextTools();
      }
    }
    
    if (isSpacePressed || e.button === 1 || !isOverInteractive) {
      isPanning = true;
      stage.classList.add('is-panning');
      const tab = getTab();
      panStartX = e.clientX - tab.panX;
      panStartY = e.clientY - tab.panY;
      closeAllMenus();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (isDraggingArtboard && draggedArtboardId) {
      const tab = getTab(); const ab = tab.artboards.find(a => a.id === draggedArtboardId);
      if (ab) {
        const dx = (e.clientX - abDragStartX) / (tab.zoom / 100);
        const dy = (e.clientY - abDragStartY) / (tab.zoom / 100);
        ab.x = abBaseX + dx; ab.y = abBaseY + dy;
        const wrapper = document.getElementById(`wrapper_${ab.id}`);
        if (wrapper) wrapper.style.transform = `translate(${ab.x}px, ${ab.y}px)`;
        markDirty();
      }
      return;
    }

    if (isPanning) {
      const tab = getTab();
      tab.panX = e.clientX - panStartX;
      tab.panY = e.clientY - panStartY;
      updateTransform();
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (isDraggingArtboard) { isDraggingArtboard = false; draggedArtboardId = null; saveStateSnapshot(); }
    if (isPanning) { isPanning = false; stage.classList.remove('is-panning'); }
  });

  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const tab = getTab(); if (!tab) return;

    const isPinch = e.ctrlKey || e.metaKey;
    const isLineScroll = e.deltaMode === 1 || e.deltaMode === 2;
    const isTrackpadSwipe = !isPinch && !isLineScroll && (Math.abs(e.deltaX) > 0 || Math.abs(e.deltaY) < 50 || e.deltaY % 1 !== 0);

    if (isPinch || !isTrackpadSwipe) {
      let delta = e.deltaY;
      if (isLineScroll) delta *= 15;
      
      // Smooth out standard mouse wheels by clamping the delta
      if (!isPinch) delta = Math.sign(delta) * Math.min(Math.abs(delta), 15);

      // Use a gentler multiplier for mouse wheels (0.003) compared to trackpad pinch (0.01)
      const zoomSpeed = isPinch ? 0.01 : 0.003;
      const zoomFactor = Math.exp(-delta * zoomSpeed);
      
      const oldZoom = tab.zoom;
      let newZoom = Math.min(500, Math.max(10, oldZoom * zoomFactor));

      const rect = stage.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      tab.panX = mouseX - (mouseX - tab.panX) * (newZoom / oldZoom);
      tab.panY = mouseY - (mouseY - tab.panY) * (newZoom / oldZoom);
      tab.zoom = newZoom;
    } else {
      tab.panX -= e.deltaX;
      tab.panY -= e.deltaY;
    }
    updateTransform();
  }, { passive: false });

  // --- EXPORT MULTI-ARTBOARD ENGINE ---
  let pendingExportFormat = null;

  function wrapCanvasText(ctx, text, maxWidth) {
    const paragraphs = String(text).split('\n');
    const lines = [];
    paragraphs.forEach(p => {
      const words = p.split(' ');
      let line = '';
      words.forEach(word => {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line); line = word;
        } else {
          line = test;
        }
      });
      lines.push(line);
    });
    return lines;
  }

  async function captureArtboard(ab, scaleMultiplier = 2, transparentBg = false) {
    if(!ab) return null;
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e) {} }

    const boardDOM = document.getElementById(`board_${ab.id}`);
    if(!boardDOM) return null;
    const boardRect = boardDOM.getBoundingClientRect();
    const scale = (ab.boardW * scaleMultiplier) / boardRect.width;

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(ab.boardW * scaleMultiplier);
    canvas.height = Math.round(boardRect.height * scale);
    const ctx = canvas.getContext('2d');

    if (!transparentBg) { ctx.fillStyle = ab.bg; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    if (ab.tiles.length === 0) return canvas;

    const tileElements = boardDOM.querySelectorAll('.tile');

    for (let i = 0; i < ab.tiles.length; i++) {
      const tileData = ab.tiles[i]; const tileEl = tileElements[i];
      if (!tileEl) continue;

      const rect = tileEl.getBoundingClientRect();
      const x = (rect.left - boardRect.left) * scale; const y = (rect.top - boardRect.top) * scale;
      const w = rect.width * scale; const h = rect.height * scale;
      const radius = ab.radius * scale;

      ctx.save(); ctx.beginPath();
      if (ctx.roundRect) { ctx.roundRect(x, y, w, h, radius); } else { ctx.rect(x, y, w, h); }
      ctx.clip();

      if(tileData.type === 'color') {
        ctx.fillStyle = tileData.hex; ctx.fillRect(x, y, w, h);
      } else if (tileData.type === 'text') {
        ctx.fillStyle = tileData.bg || '#fef2a0';
        ctx.fillRect(x, y, w, h);
        
        const fontSize = (tileData.fontSize || 28) * scaleMultiplier;
        const padding = 16 * scaleMultiplier;
        
        ctx.fillStyle = tileData.color || '#111111';
        ctx.font = `${fontSize}px 'Space Grotesk', sans-serif`;
        const align = tileData.textAlign || 'center';
        ctx.textAlign = align; 
        ctx.textBaseline = 'middle';
        
        const lines = wrapCanvasText(ctx, tileData.text || '', w - padding * 2);
        const lineHeight = fontSize * 1.3;
        const totalHeight = lines.length * lineHeight;
        let ly = y + h / 2 - totalHeight / 2 + lineHeight / 2;
        
        lines.forEach(line => { 
          let lx = x + w / 2;
          if (align === 'left') lx = x + padding;
          if (align === 'right') lx = x + w - padding;
          ctx.fillText(line, lx, ly); 
          ly += lineHeight; 
        });
      } else {
        const img = await new Promise((resolve) => {
          const image = new Image(); image.crossOrigin = 'anonymous';
          image.onload = () => resolve(image); image.onerror = () => resolve(null); image.src = tileData.src;
        });
        if(img) {
          const imgRatio = img.naturalWidth / img.naturalHeight; const boxRatio = w / h; let sw, sh, sx, sy;
          if (imgRatio > boxRatio) {
            sh = img.naturalHeight; sw = sh * boxRatio; sx = (img.naturalWidth - sw) * ((tileData.cropX || 50) / 100); sy = 0;
          } else {
            sw = img.naturalWidth; sh = sw / boxRatio; sx = 0; sy = (img.naturalHeight - sh) * ((tileData.cropY || 50) / 100);
          }
          ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
        }
      }
      ctx.restore();
    }
    return canvas;
  }

  function filenameSafe(tabName, abName){
    let name = (tabName || 'Saved') + (abName ? '-' + abName : '');
    return name.trim().replace(/[^a-z0-9\-_ ]/gi,'').replace(/\s+/g,'-').toLowerCase() || 'moodboard';
  }

  async function exportPNGs(selectedIds, scale, transparent){
    toast(`Rendering PNGs (${scale}x)...`); document.body.classList.add('exporting'); const tab = getTab();
    for(const id of selectedIds) {
      const ab = tab.artboards.find(a => a.id === id); if(!ab) continue;
      const canvas = await captureArtboard(ab, scale, transparent); if(!canvas) continue;
      const a = document.createElement('a'); a.download = filenameSafe(tab.name, ab.name) + '.png';
      a.href = canvas.toDataURL('image/png', 1.0); a.click(); await new Promise(r => setTimeout(r, 400));
    }
    document.body.classList.remove('exporting');
  }

  async function exportMultiPDF(selectedIds){
    toast('Rendering High-Res PDF…'); document.body.classList.add('exporting');
    const tab = getTab(); const { jsPDF } = window.jspdf; let pdf = null;
    for (let i = 0; i < selectedIds.length; i++) {
      const ab = tab.artboards.find(a => a.id === selectedIds[i]); if(!ab) continue;
      const canvas = await captureArtboard(ab, 3, false); if(!canvas) continue;
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const pageW = canvas.width / 3; const pageH = canvas.height / 3;
      const orientation = pageW >= pageH ? 'landscape' : 'portrait';
      if (!pdf) { pdf = new jsPDF({ orientation, unit: 'px', format: [pageW, pageH] }); } 
      else { pdf.addPage([pageW, pageH], orientation); }
      pdf.addImage(imgData, 'JPEG', 0, 0, pageW, pageH);
    }
    if(pdf) {
      let fName = selectedIds.length > 1 ? tab.name + '-boards' : tab.name + '-' + tab.artboards.find(a=>a.id===selectedIds[0]).name;
      pdf.save(filenameSafe(fName, '') + '.pdf');
    }
    document.body.classList.remove('exporting');
  }

  async function exportZIP(selectedIds, scale = 2){
    toast(`Packaging ZIP (${scale}x)...`); document.body.classList.add('exporting');
    const tab = getTab();
    try {
      const zip = new JSZip();
      for(const id of selectedIds) {
        const ab = tab.artboards.find(a => a.id === id); if(!ab) continue;
        const canvas = await captureArtboard(ab, scale, false); if(!canvas) continue;
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png', 1.0));
        const boardName = filenameSafe(tab.name, ab.name);
        if(blob) zip.file(boardName + '.png', blob);

        // Export individual tiles
        const boardDOM = document.getElementById(`board_${ab.id}`);
        const tileElements = boardDOM ? boardDOM.querySelectorAll('.tile') : [];
        const tileFolder = zip.folder(boardName + "_tiles");
        
        for (let i = 0; i < ab.tiles.length; i++) {
          const tile = ab.tiles[i];
          const tileEl = tileElements[i];
          
          if (tile.type === 'image' && tile.src) {
             const base64Data = tile.src.split(',')[1];
             if (base64Data) {
               tileFolder.file(`tile_${i+1}_image.png`, base64Data, {base64: true});
             }
          } else if (tile.type === 'color' || tile.type === 'text') {
             let tw = 400, th = 400;
             let screenToCanvasScale = scale;
             if (tileEl && boardDOM) {
                const boardRect = boardDOM.getBoundingClientRect();
                screenToCanvasScale = (ab.boardW * scale) / boardRect.width;
                const rect = tileEl.getBoundingClientRect();
                tw = rect.width * screenToCanvasScale;
                th = rect.height * screenToCanvasScale;
             }
             const tcvs = document.createElement('canvas');
             tcvs.width = tw || 400; tcvs.height = th || 400;
             const ctx = tcvs.getContext('2d');
             
             if (tile.type === 'color') {
                ctx.fillStyle = tile.hex; ctx.fillRect(0,0,tw,th);
             } else if (tile.type === 'text') {
                ctx.fillStyle = tile.bg || '#fef2a0';
                ctx.fillRect(0,0,tw,th);
                
                const fontSize = (tile.fontSize || 28) * scale;
                const padding = 16 * scale;

                ctx.fillStyle = tile.color || '#111111';
                ctx.font = `${fontSize}px 'Space Grotesk', sans-serif`;
                
                const align = tile.textAlign || 'center';
                ctx.textAlign = align; 
                ctx.textBaseline = 'middle';
                
                const lines = wrapCanvasText(ctx, tile.text || '', tw - padding * 2);
                const lineHeight = fontSize * 1.3;
                const totalHeight = lines.length * lineHeight;
                let ly = th / 2 - totalHeight / 2 + lineHeight / 2;
                
                lines.forEach(line => { 
                  let lx = tw / 2;
                  if (align === 'left') lx = padding;
                  if (align === 'right') lx = tw - padding;
                  ctx.fillText(line, lx, ly); 
                  ly += lineHeight; 
                });
             }
             const tblob = await new Promise(res => tcvs.toBlob(res, 'image/png', 1.0));
             if(tblob) tileFolder.file(`tile_${i+1}_${tile.type}.png`, tblob);
          }
        }
      }
      const content = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a'); a.href = url;
      a.download = filenameSafe(tab.name, 'boards') + '.zip';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('ZIP downloaded');
    } catch(err) {
      toast('ZIP export failed');
    }
    document.body.classList.remove('exporting');
  }

  function updateSelectAllState() {
    const checks = Array.from(document.querySelectorAll('.ab-export-chk'));
    const allChecked = checks.every(c => c.checked);
    $('#selectAllBoards').checked = allChecked && checks.length > 0;
  }
  $('#selectAllBoards').onchange = (e) => {
    const checked = e.target.checked;
    document.querySelectorAll('.ab-export-chk').forEach(chk => chk.checked = checked);
  };
  $('#exportBoardList').addEventListener('change', updateSelectAllState);

  function openExportModal() {
    const tab = getTab(); if(!tab || tab.artboards.length === 0) { toast("No artboards to export"); return; }
    const list = $('#exportBoardList'); list.innerHTML = '';
    const selectAllByDefault = pendingExportFormat === 'zip';
    tab.artboards.forEach(ab => {
      const lbl = document.createElement('label'); const chk = document.createElement('input');
      chk.type = 'checkbox'; chk.value = ab.id; chk.className = 'ab-export-chk';
      if(selectAllByDefault || ab.id === tab.activeArtboardId) chk.checked = true;
      lbl.appendChild(chk); lbl.appendChild(document.createTextNode(ab.name)); list.appendChild(lbl);
    });
    updateSelectAllState(); $('#exportModal').classList.add('open');
  }

  $('#cancelExportBtn').onclick = () => { $('#exportModal').classList.remove('open'); pendingExportFormat = null; };

  $('#confirmExportBtn').onclick = async () => {
    const selectedIds = Array.from(document.querySelectorAll('.ab-export-chk')).filter(chk => chk.checked).map(chk => chk.value);
    if(selectedIds.length === 0) { toast("Select at least one artboard"); return; }
    $('#exportModal').classList.remove('open'); const fmt = pendingExportFormat; pendingExportFormat = null;
    try{
      if(fmt==='png-1') await exportPNGs(selectedIds, 1, false);
      else if(fmt==='png-2') await exportPNGs(selectedIds, 2, false);
      else if(fmt==='png-3') await exportPNGs(selectedIds, 3, false);
      else if(fmt==='png-alpha') await exportPNGs(selectedIds, 2, true);
      else if(fmt==='pdf') await exportMultiPDF(selectedIds);
      else if(fmt==='zip') await exportZIP(selectedIds, 2);
    }catch(err){ toast('Export failed'); }
  };

  async function refreshProjectsMenu(){
    const menu = $('#projectsMenu');
    menu.innerHTML = '<div class="menu-meta">Loading...</div>';
    
    const idx = await getAllSavedProjectSummaries();
    menu.innerHTML = '';
    if(!idx || idx.length === 0){
      menu.innerHTML = '<div class="menu-meta">No saved projects</div>';
      return;
    }
    idx.sort((a,b)=> (b.updatedAt || 0) - (a.updatedAt || 0));
    idx.forEach(p=>{
      const row = document.createElement('div');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      
      const openBtn = document.createElement('button');
      openBtn.style.flex = '1';
      openBtn.textContent = p.name || 'Untitled';
      openBtn.onclick = (e) => {
        e.stopPropagation();
        loadProject(p.id);
      };

      const delBtn = document.createElement('button');
      delBtn.innerHTML = '&times;';
      delBtn.style.flex = 'none';
      delBtn.style.padding = '8px 12px';
      delBtn.style.color = 'var(--text-dim)';
      delBtn.title = 'Delete';
      delBtn.onclick = async (e)=>{
        e.stopPropagation();
        if(confirm('Delete "' + (p.name || 'Untitled') + '"?')) {
          await deleteProject(p.id);
        }
      };
      
      row.appendChild(openBtn);
      row.appendChild(delBtn);
      menu.appendChild(row);
    });
  }

  $('#newBtn').onclick = ()=>{
    if(dirty && !confirm('Discard unsaved changes?')) return;
    addNewTab();
  };
  $('#saveBtn').onclick = saveProject;
  $('#saveDeviceBtn').onclick = saveProjectToDevice;
  $('#undoBtn').onclick = undo;
  $('#redoBtn').onclick = redo;

  $('#projectsBtn').onclick = async (e)=>{
    e.stopPropagation();
    const menu = $('#projectsMenu'); const willOpen = !menu.classList.contains('open');
    closeAllMenus();
    if(willOpen){
      menu.classList.add('open');
      await refreshProjectsMenu();
    }
  };

  $('#exportBtn').onclick = (e)=>{
    e.stopPropagation();
    const menu = $('#exportMenu'); const willOpen = !menu.classList.contains('open');
    closeAllMenus(); 
    if(willOpen) menu.classList.add('open');
  };

  $('#exportMenu').addEventListener('click', (e)=>{
    const fmt = e.target.dataset.fmt; if(!fmt) return;
    closeAllMenus(); pendingExportFormat = fmt; openExportModal();
  });

  function closeAllMenus(){
    document.querySelectorAll('.menu').forEach(m=> m.classList.remove('open'));
    contextMenu.classList.remove('open');
    
    // Close the custom color picker when clicking away
    const ccp = document.getElementById('customColorPicker');
    if (ccp && ccp.classList.contains('open')) {
      ccp.classList.remove('open');
      if (activeColorCloseCallback) {
        activeColorCloseCallback();
        activeColorCloseCallback = null;
      }
    }
  }

  document.addEventListener('click', closeAllMenus);

  refreshAppUI(); saveStateSnapshot();
})();
</script>
