<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/saved_icon_3x.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --ink: #161616;
    --panel: rgba(28, 28, 28, 0.85);
    --panel-2: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.12);
    --border-hover: rgba(255, 255, 255, 0.25);
    --text: #f0f0f0;
    --text-dim: #999999;
    --accent: #ffffff;
    --accent-soft: rgba(255, 255, 255, 0.15);
    --grid-dot: rgba(255, 255, 255, 0.06);
    --tile-bg: #222222;
    --shadow-base: rgba(0, 0, 0, 0.6);
    --shadow-soft: rgba(0, 0, 0, 0.3);
  }

  body.light-mode {
    color-scheme: light;
    --ink: #f0f0f0;
    --panel: rgba(255, 255, 255, 0.85);
    --panel-2: rgba(0, 0, 0, 0.05);
    --border: rgba(0, 0, 0, 0.1);
    --border-hover: rgba(0, 0, 0, 0.2);
    --text: #111111;
    --text-dim: #777777;
    --accent: #000000;
    --accent-soft: rgba(0, 0, 0, 0.08);
    --grid-dot: rgba(0, 0, 0, 0.06);
    --tile-bg: #e0e0e0;
    --shadow-base: rgba(0, 0, 0, 0.1);
    --shadow-soft: rgba(0, 0, 0, 0.05);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background: var(--ink); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; font-size:12.5px;
    overflow:hidden; transition: background-color 0.4s ease, color 0.4s ease;
    user-select: none; -webkit-user-select: none;
  }
  button, input, select{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:1px solid var(--accent); outline-offset:2px; }

  .app{ display:flex; flex-direction:column; height:100vh; position:relative; }

  /* ---------- Top Bar & Tabs ---------- */
  .top-container {
    flex: none; display: flex; flex-direction: column;
    border-bottom: 1px solid var(--border); background: var(--panel);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    z-index: 50; transition: background-color 0.4s, border-color 0.4s;
  }
  
  .topbar{ display:flex; align-items:center; gap:8px; padding:0 24px; height:56px; }
  
  .brand{ display: flex; align-items: center; flex: none; }
  .brand img { height: 24px; width: auto; object-fit: contain; }
  .brand .logo-light { display: none; }
  body.light-mode .brand .logo-dark { display: none; }
  body.light-mode .brand .logo-light { display: block; }
  
  .titlefield{
    background:transparent; border:1px solid transparent; color:var(--text);
    font-size:13px; font-weight:400; padding:4px 8px; border-radius:4px;
    min-width:130px; max-width:260px; transition: all 0.2s;
  }
  .titlefield:hover, .titlefield:focus{ border-color:var(--border-hover); background:var(--panel-2); }
  .save-state{ font-size:11px; color:var(--text-dim); flex:none; font-weight: 300; }
  .save-state.dirty::before{ content:"● "; color:var(--text-dim); }
  .spacer{ flex:1; }

  .btn{
    background:transparent; border:1px solid transparent; color:var(--text);
    padding:6px 12px; border-radius:6px; font-weight:400; transition:all .2s;
    display: flex; align-items: center; gap: 6px; font-size:12.5px;
  }
  .btn:hover{ background: var(--panel-2); }
  .btn.outlined { border-color: var(--border); }
  .btn.outlined:hover { border-color: var(--border-hover); }
  .btn.primary{ background:var(--accent); color:var(--ink); font-weight: 500; }
  .btn.primary:hover{ opacity: 0.85; }
  .btn:disabled{ opacity: 0.3; cursor: not-allowed; color: var(--text-dim); }
  
  .icon-btn { font-size: 14px; padding: 6px; display: flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; }

  .tab-bar {
    display: flex; align-items: center; gap: 4px; padding: 0 16px 8px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-radius: 6px; background: transparent; color: var(--text-dim);
    font-size: 12px; cursor: pointer; border: 1px solid transparent;
    transition: all 0.2s; max-width: 180px; white-space: nowrap;
  }
  .tab:hover { background: var(--panel-2); color: var(--text); }
  .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--border); font-weight: 500; }
  .tab-close {
    background: transparent; border: none; color: inherit; font-size: 14px;
    line-height: 1; padding: 2px 4px; border-radius: 4px; opacity: 0.6; display: flex; align-items: center; justify-content: center;
  }
  .tab-close svg { width: 12px; height: 12px; }
  .tab-close:hover { opacity: 1; background: var(--border-hover); color: var(--text); }
  .add-tab-btn {
    background: transparent; border: 1px dashed var(--border); color: var(--text-dim);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all 0.2s;
  }
  .add-tab-btn:hover { border-color: var(--text); color: var(--text); }

  .menu-wrap{ position:relative; flex:none; }
  .menu{
    position:absolute; top:calc(100% + 8px); right:0; min-width:200px;
    background:var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border:1px solid var(--border); border-radius:8px;
    padding:6px; display:none; flex-direction:column; gap:2px; z-index:70;
    box-shadow:0 16px 40px var(--shadow-base); max-height: 360px; overflow-y: auto;
  }
  .menu.open{ display:flex; }
  .menu button{
    background:transparent; border:none; text-align:left; padding:8px 12px;
    border-radius:4px; color:var(--text); font-size:12.5px; font-weight: 400; transition: background 0.15s;
  }
  .menu button:hover{ background:var(--panel-2); }
  .menu .menu-meta{ font-size:10.5px; color:var(--text-dim); padding:4px 12px 6px; text-transform: uppercase; letter-spacing: 1px;}
  .menu hr{ border:none; border-top:1px solid var(--border); margin:4px 2px; }

  /* ---------- Canvas Stage & Artboards ---------- */
  .stage{
    flex:1; overflow:hidden; position:relative; cursor:default;
    background-color: transparent;
    background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .stage.is-panning { cursor: grabbing !important; }
  .stage.space-down { cursor: grab !important; }

  .viewport-canvas{ position:absolute; transform-origin: 0 0; }

  .artboard-wrapper {
    position: absolute; display: flex; flex-direction: column; gap: 12px;
    transition: opacity 0.2s;
  }
  .artboard-header { 
    display: flex; align-items: center; justify-content: space-between; 
    cursor: grab; padding: 4px; border-radius: 6px; transition: background 0.2s;
  }
  .artboard-header:active { cursor: grabbing; }
  .artboard-header:hover { background: var(--panel-2); }

  .artboard-title {
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
    font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; padding: 4px 8px; border-radius: 4px;
    transition: all 0.2s; outline: none; width: 200px; cursor: text;
  }
  .artboard-wrapper.active .artboard-title { color: var(--accent); }
  .artboard-title:hover, .artboard-title:focus { background: var(--panel-2); border-color: var(--border); color: var(--text); }
  
  .artboard-delete {
    background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; border-radius: 4px; opacity: 0; transition: all 0.2s;
  }
  .artboard-wrapper:hover .artboard-delete { opacity: 1; }
  .artboard-delete:hover { background: rgba(255,0,0,0.2); color: #ff4444; }

  .board{
    display:grid; box-shadow:0 24px 80px var(--shadow-soft); position:relative;
    box-sizing: border-box; align-content: start; grid-auto-flow: dense;
    border: 1px solid transparent; transition: border-color 0.2s;
  }
  .artboard-wrapper.active .board { border-color: var(--border-hover); }
  
  .tile{
    position:relative; overflow:hidden; background:transparent; cursor:grab; width: 100%; box-sizing: border-box; 
  }
  
  .tile.is-selected { box-shadow: 0 0 0 2px var(--accent); z-index: 10; }
  .tile:active{ cursor:grabbing; }
  .tile.dragging { opacity: 0.3; }
  .tile.cropping{ cursor:ns-resize; }
  .tile.drag-over::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    border: 2px dashed var(--accent); background: var(--accent-soft);
    pointer-events: none; z-index: 30;
  }
  
  .img-layer {
    position: absolute; top:-1px; left:-1px; right:-1px; bottom:-1px;
    background-size: cover; background-repeat: no-repeat; pointer-events: none;
  }

  .color-tile-layer {
    position: absolute; top:-1px; left:-1px; right:-1px; bottom:-1px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity 0.2s;
  }
  .color-tile-layer:hover { opacity: 0.9; }
  .color-tile-badge {
    background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); color: #fff;
    padding: 6px 10px; border-radius: 6px; font-family: 'Space Grotesk', monospace;
    font-size: 12px; font-weight: 500; letter-spacing: 1px; z-index: 5; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .text-tile-layer {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden; word-break: break-word;
    font-family: 'Space Grotesk', sans-serif; line-height: 1.3; outline: none; cursor: text;
    box-shadow: inset 0 -15px 25px rgba(0,0,0,0.05);
  }
  .text-tile-layer::selection { background: rgba(0, 120, 255, 0.4); }
  .text-tile-layer *::selection { background: rgba(0, 120, 255, 0.4); }

  .text-color-picker { 
    width: 20px !important; height: 20px !important; padding: 0; border: 1px solid rgba(128,128,128,0.3) !important; 
    border-radius: 4px; cursor: pointer; transition: transform 0.1s;
  }
  .text-color-picker:hover { transform: scale(1.15); box-shadow: 0 0 0 1px var(--accent); }

  .tile .remove{
    position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%;
    background:var(--panel); backdrop-filter: blur(4px); border:1px solid var(--border); 
    color:var(--text); font-size:12px; display:flex; align-items:center; justify-content:center; 
    opacity:0; transition:opacity .15s; z-index: 20; padding: 0;
  }
  .tile .remove svg { width: 12px; height: 12px; }
  .tile:hover .remove{ opacity:1; }

  .empty-state{
    grid-column:1/-1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; padding:60px 20px; text-align:center;
    border:1px dashed var(--border); border-radius:6px; color:var(--text-dim); width: 100%; min-height: 240px;
  }
  .empty-state.drag-over{ border-color:var(--accent); background:var(--accent-soft); }
  .empty-state .big{ font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--text); font-weight:500; letter-spacing: 1px; text-transform: uppercase;}

  /* ---------- Side Panels & Dock ---------- */
  .left-panel {
    position: absolute; top: 50%; left: 24px; transform: translateY(-50%);
    background: var(--panel); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    display: flex; flex-direction: column; gap: 10px; z-index: 40;
    box-shadow: 0 20px 50px var(--shadow-base); transition: background-color 0.4s, border-color 0.4s;
  }
  .left-panel .btn-add { 
    padding: 10px; display: flex; align-items: center; justify-content: center; 
    width: 44px; height: 44px; border-radius: 8px; background: transparent; 
    border: 1px solid var(--border); color: var(--text);
    transition: all 0.15s; cursor: pointer;
  }
  .left-panel .btn-add svg { width: 20px; height: 20px; }
  .left-panel .btn-add:hover{ border-color: var(--border-hover); background: var(--panel-2); }
  .left-panel .btn-add.color:hover { background: rgba(166,50,84,0.15); border-color: var(--accent); }

  .fab-right {
    position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: var(--ink); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 40; box-shadow: 0 16px 40px var(--shadow-base);
    transition: transform 0.2s, opacity 0.2s;
  }
  .fab-right:hover { transform: translateY(-50%) scale(1.05); opacity: 0.9; }

  .bottom-dock{
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px;
    display: flex; align-items: center; gap: 18px; z-index: 40;
    box-shadow: 0 20px 50px var(--shadow-base); transition: background-color 0.4s, border-color 0.4s, box-shadow 0.4s;
  }
  
  #contextToolsDock {
    bottom: 84px; padding: 6px 16px; z-index: 45; 
  }

  .dock-group{ display: flex; align-items:center; gap: 8px; }
  .dock-divider{ width: 1px; height: 16px; background: var(--border); }
  .dock-label{
    font-size: 10px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 1px; font-weight: 500; font-family: 'Space Grotesk', sans-serif;
  }
  .dock-control{ display: flex; align-items: center; gap: 4px; }
  .dock-control select, .dock-control input[type="number"]{
    background: transparent; border: 1px solid transparent; border-radius: 4px;
    padding: 4px 6px; font-size: 12px; color: var(--text); outline: none; transition: all 0.2s;
  }
  .dock-control select:hover, .dock-control input[type="number"]:hover { background: var(--panel-2); border-color: var(--border-hover); }
  select option { background-color: var(--ink); color: var(--text); }
  
  .dock-control input[type="range"]{
    -webkit-appearance:none; width: 60px; height: 2px; border-radius:1px;
    background:var(--border-hover); outline:none; transition: background 0.2s;
  }
  .dock-control input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--accent); cursor:pointer;
  }
  .dock-value{
    font-size:11px; color:var(--text-dim); min-width:16px; text-align:right;
    font-variant-numeric: tabular-nums; font-family:'Space Grotesk',sans-serif;
  }
  
  .dock-stepper{
    display: flex; align-items: center; background: transparent;
    border: 1px solid transparent; border-radius: 4px; overflow: hidden; transition: all 0.2s;
  }
  .dock-stepper:hover { background: var(--panel-2); border-color: var(--border-hover); }
  .dock-stepper button{ background: transparent; border: none; padding: 4px 6px; color: var(--text-dim); font-size: 12px; }
  .dock-stepper button:hover{ color: var(--text); }
  .dock-stepper span{ padding: 0 2px; font-size: 11.5px; font-weight: 400; min-width: 14px; text-align: center; }

  .swatches{ display:flex; gap:6px; align-items:center; }
  .swatch{
    width:16px; height:16px; border-radius:50%; border:1px solid var(--border);
    cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); transition: transform 0.15s;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active{ border-color:var(--accent); transform: scale(1.1); }
  .swatch.custom{
    display:flex; align-items:center; justify-content:center; background:var(--panel-2);
    font-size:10px; color:var(--text-dim); position:relative; overflow:hidden;
  }

  /* ---------- Global Custom Color Picker ---------- */
  .custom-color-picker {
    position: fixed; background: var(--panel); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: none; flex-direction: column;
    gap: 12px; z-index: 9999; box-shadow: 0 20px 50px var(--shadow-base); width: 200px;
  }
  .custom-color-picker.open { display: flex; }
  .ccp-swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .ccp-swatch { 
    width: 100%; aspect-ratio: 1; border-radius: 6px; 
    border: 1px solid rgba(128,128,128,0.3); cursor: pointer; 
    transition: transform 0.1s, box-shadow 0.1s; 
  }
  .ccp-swatch:hover { transform: scale(1.2); box-shadow: 0 0 0 2px var(--accent); z-index: 2; }
  .ccp-hex { 
    display: flex; align-items: center; gap: 6px; background: var(--panel-2); 
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; 
    transition: border-color 0.2s;
  }
  .ccp-hex:focus-within { border-color: var(--accent); }
  .ccp-hex span { color: var(--text-dim); font-size: 13px; font-weight: 500; }
  .ccp-hex input { 
    background: transparent; border: none; color: var(--text); outline: none; 
    width: 100%; font-family: 'Space Grotesk', monospace; text-transform: uppercase; 
    font-size: 14px; font-weight: 500; letter-spacing: 1px;
  }

  .ccp-actions { 
    display: flex; gap: 8px; border-top: 1px solid var(--border); 
    padding-top: 12px; margin-top: 4px; 
  }
  .ccp-action-btn {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1px solid transparent; border-radius: 6px;
    padding: 8px; cursor: pointer; color: var(--text); transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .ccp-action-btn:hover { background: var(--border-hover); border-color: var(--border); }
  .ccp-action-btn svg { width: 14px; height: 14px; stroke: currentColor; }

  .toast{
    position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--panel); backdrop-filter: blur(12px); border:1px solid var(--border); color:var(--text);
    padding:8px 16px; border-radius:6px; font-size:12px; opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease; z-index:100; font-weight: 400;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .context-menu {
    position: fixed; background: var(--panel); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px; display: none; flex-direction: column;
    gap: 2px; z-index: 100; box-shadow: 0 16px 40px var(--shadow-base); min-width: 140px;
  }
  .context-menu.open { display: flex; }
  .context-menu button {
    background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 12.5px; 
    padding: 8px 12px; border-radius: 5px; width: 100%; text-align: left; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .context-menu button:hover { background: var(--accent); color: var(--ink); }

  body.exporting .tile::after { display: none !important; }
  input[type=file] { display:none !important; }

  /* ---------- Modal Overlay ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; width: 320px; max-width: 90vw; display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 24px 80px var(--shadow-base);
  }
  .modal h3 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 16px; color: var(--text); }
  .modal-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
  .modal-list label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; color: var(--text); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="top-container">
    <div class="topbar">
      
      <div class="brand">
        <img class="logo-dark" src="assets/saved_white_3x.png" alt="Saved">
        <img class="logo-light" src="assets/saved_black_3x.png" alt="Saved">
      </div>
      
      <input class="titlefield" id="titleField" value="Untitled" spellcheck="false" title="Project Name" style="margin-left: 8px;">
      <span class="save-state" id="saveState">Saved</span>
      
      <div class="dock-group" style="margin-left: 12px;">
        <button class="btn ghost icon-btn" id="undoBtn" title="Undo (Ctrl+Z / Cmd+Z)" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
        </button>
        <button class="btn ghost icon-btn" id="redoBtn" title="Redo (Ctrl+Y / Cmd+Shift+Z)" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
        </button>
      </div>

      <div class="spacer"></div>

      <button class="btn ghost icon-btn" id="themeBtn" title="Toggle Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>

          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.464-.652-.464-1.063 0-.832.674-1.5 1.5-1.5H16c3.314 0 6-2.686 6-6 0-5.5-4.5-10-10-10z"/>

          <path d="m2 22 1-1h3l9-9"/>
          <path d="M3 21v-3l9-9"/>
          <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = (sel) => document.querySelector(sel);
  const generateId = () => Math.random().toString(36).substr(2, 9);

  // DOM Elements
  const stage = $('#stage');
  const viewportCanvas = $('#viewportCanvas');
  const tabBar = $('#tabBar');
  const contextMenu = $('#contextMenu');

  window.__clipboardTile = null;

  function safeGetLocal(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
  function safeSetLocal(key, val) { try { localStorage.setItem(key, val); return true; } catch(e) { return false; } }
  function safeRemoveLocal(key) { try { localStorage.removeItem(key); } catch(e) {} }

  // -------------------------------------------------------------
  // THEME MANAGEMENT (Dynamic SVG Icon)
  // -------------------------------------------------------------
  const sunIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
  const moonIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

  let isLightMode = safeGetLocal('gridwork-theme') === 'light';
  if (isLightMode) document.body.classList.add('light-mode');
  
  function updateThemeIcon() { $('#themeBtn').innerHTML = isLightMode ? moonIcon : sunIcon; }
  updateThemeIcon();
  
  $('#themeBtn').onclick = () => {
    isLightMode = !isLightMode;
    document.body.classList.toggle('light-mode', isLightMode);
    safeSetLocal('gridwork-theme', isLightMode ? 'light' : 'dark');
    updateThemeIcon();
  };

  // -------------------------------------------------------------
  // GLOBAL CUSTOM COLOR PICKER LOGIC
  // -------------------------------------------------------------
  const colorPickerUI = $('#customColorPicker');
  const ccpHexInput = $('#ccpHexInput');
  const ccpSwatches = $('#ccpSwatches');
  const ccpNative = $('#ccpNative');
  const ccpEyeDropper = $('#ccpEyeDropper');
  
  let activeColorCallback = null;
  let activeColorCloseCallback = null;

  const presetColors = [
    '#111111', '#444444', '#888888', '#CCCCCC', '#E5E5E5', '#FFFFFF',
    '#FF3B30', '#FF9500', '#FFCC00', '#4CD964', '#5AC8FA', '#007AFF',
    '#5856D6', '#FF2D55', '#E91E63', '#A2845E', '#FEF2A0', '#E4F4F3'
  ];

  presetColors.forEach(hex => {
    const btn = document.createElement('div');
    btn.className = 'ccp-swatch';
    btn.style.backgroundColor = hex;
    btn.onclick = (e) => {
      e.stopPropagation();
      ccpHexInput.value = hex.replace('#', '');
      if(activeColorCallback) activeColorCallback(hex);
    };
    ccpSwatches.appendChild(btn);
  });

  ccpHexInput.addEventListener('input', (e) => {
    let val = e.target.value.replace(/[^0-9A-Fa-f]/g, '').substring(0, 6);
    e.target.value = val;
    if (val.length === 6) {
      if(activeColorCallback) activeColorCallback('#' + val);
    }
  });

  ccpNative.addEventListener('input', (e) => {
    const hex = e.target.value;
    ccpHexInput.value = hex.replace('#', '');
    if(activeColorCallback) activeColorCallback(hex);
  });
  
  ccpNative.addEventListener('change', () => {
    if(activeColorCloseCallback) activeColorCloseCallback();
  });

  ccpEyeDropper.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!window.EyeDropper) {
      toast("Eyedropper not supported in this browser");
      return;
    }
    try {
      const eyeDropper = new EyeDropper();
      const result = await eyeDropper.open();
      const hex = result.sRGBHex;
      ccpHexInput.value = hex.replace('#', '');
      if(activeColorCallback) activeColorCallback(hex);
      if(activeColorCloseCallback) activeColorCloseCallback();
    } catch (err) {
      // User cancelled
    }
  });

  function openColorPicker(x, y, currentColor, onChange, onClose) {
    closeAllMenus();
    activeColorCallback = onChange;
    activeColorCloseCallback = onClose;
    
    const safeColor = (currentColor || '#ffffff').substring(0, 7);
    ccpHexInput.value = safeColor.replace('#', '');
    ccpNative.value = safeColor;
    
    let px = x; let py = y - 260; // Open upward from the dock
    if (px + 200 > window.innerWidth) px -= 200;
    if (py < 0) py = y + 30; 
    
    colorPickerUI.style.left = `${px}px`;
    colorPickerUI.style.top = `${py}px`;
    colorPickerUI.classList.add('open');
  }

  // Prevent clicks inside picker from closing it
  colorPickerUI.addEventListener('mousedown', e => e.stopPropagation());
  colorPickerUI.addEventListener('click', e => e.stopPropagation());


  // -------------------------------------------------------------
  // STATE ARCHITECTURE
  // -------------------------------------------------------------
  const RATIO_PRESETS = ['1/1', '4/5', '3/2', '16/9'];

  const createArtboard = (name = "Artboard") => ({
    id: 'ab_' + generateId(), x: 0, y: 0, name: name, template: 'standard',
    columns: 3, gap: 12, radius: 0, ratio: '1/1', customSize: false,
    boardW: 760, boardH: 760, padding: 24, 
    bg: isLightMode ? '#e5e5e5' : '#161616', tiles: [], selectedTileIndex: null 
  });

  function normalizeArtboard(ab) {
    if (typeof ab.customSize !== 'boolean') ab.customSize = false;
    if (typeof ab.ratio !== 'string') ab.ratio = '1/1';
    if (!Array.isArray(ab.tiles)) ab.tiles = [];
    ab.tiles.forEach(t => {
      if (!t.type) t.type = 'image';
      if (t.type === 'image') { if (t.cropX == null) t.cropX = 50; if (t.cropY == null) t.cropY = 50; }
      if (t.type === 'text') { 
        if (t.fontSize == null) t.fontSize = 28; 
        if (!t.color) t.color = '#111111'; // Default dark text for sticky notes
        if (!t.bg) t.bg = '#fef2a0'; // Default warm yellow sticky note bg
        if (t.text == null) t.text = ''; 
        if (!t.textAlign) t.textAlign = 'center';
      }
    });
    return ab;
  }

  const createProject = (name = "Untitled") => ({
    id: 'p_' + generateId(), name: name, zoom: 100, panX: 40, panY: 40,
    activeArtboardId: null, artboards: [createArtboard('Board 1')],
    undoStack: [], redoStack: []
  });

  let appState = { tabs: [createProject()], activeTabId: null };
  appState.activeTabId = appState.tabs[0].id;
  appState.tabs[0].activeArtboardId = appState.tabs[0].artboards[0].id;

  let isInternalChange = false;
  let dirty = false;
  let selectedContextData = { artboardId: null, tileIndex: null };

  function getTab() { return appState.tabs.find(t => t.id === appState.activeTabId); }
  function getActiveArtboard() {
    const tab = getTab(); if (!tab || !tab.activeArtboardId) return null;
    return tab.artboards.find(a => a.id === tab.activeArtboardId);
  }
  function getSelectedTile() {
    const ab = getActiveArtboard();
    if (!ab || ab.selectedTileIndex === null) return null;
    return { ab, tile: ab.tiles[ab.selectedTileIndex], index: ab.selectedTileIndex };
  }

  // -------------------------------------------------------------
  // IMAGE COMPRESSION ENGINE
  // -------------------------------------------------------------
  function compressImage(fileOrBlob, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader(); reader.onerror = reject;
      reader.onload = () => {
        const img = new Image(); img.onerror = reject;
        img.onload = () => {
          let w = img.naturalWidth, h = img.naturalHeight;
          const scale = Math.min(1, maxDim / Math.max(w,h));
          w = Math.round(w*scale); h = Math.round(h*scale);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          const isPNG = fileOrBlob && fileOrBlob.type === 'image/png';
          resolve({ dataUrl: c.toDataURL(isPNG ? 'image/png' : 'image/jpeg', isPNG ? undefined : quality) });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(fileOrBlob);
    });
  }

  // -------------------------------------------------------------
  // CENTRAL KEYBOARD SHORTCUTS MANAGER
  // -------------------------------------------------------------
  let isSpacePressed = false;
  let isAltPressed = false;

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Alt' || e.altKey) isAltPressed = true;

    const isEditingText = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable;

    if (e.code === 'Space' && !isEditingText) {
      isSpacePressed = true;
      stage.classList.add('space-down');
      e.preventDefault(); 
    }

    if (isEditingText) return;
    
    // Save
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault(); saveProject(); return;
    }

    // Undo
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
      e.preventDefault(); undo(); return;
    }
    
    // Redo
    if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
      e.preventDefault(); redo(); return;
    }

    const ab = getActiveArtboard();

    // Copy
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
      if (ab && ab.selectedTileIndex !== null && ab.selectedTileIndex !== undefined) {
        e.preventDefault();
        const tileToCopy = ab.tiles[ab.selectedTileIndex];
        window.__clipboardTile = JSON.parse(JSON.stringify(tileToCopy));
        toast("Tile copied");
      }
    }

    // Delete
    if ((e.key === 'Delete' || e.key === 'Backspace') && ab && ab.selectedTileIndex !== null && ab.selectedTileIndex !== undefined) {
      e.preventDefault();
      ab.tiles.splice(ab.selectedTileIndex, 1);
      ab.selectedTileIndex = null;
      renderStage(); saveStateSnapshot(); markDirty();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'Alt' || !e.altKey) isAltPressed = false;
    if (e.code === 'Space') {
      isSpacePressed = false;
      stage.classList.remove('space-down');
    }
  });

  // --- PASTE EVENT HANDLER (Supports Web Image Copy/Paste & Internal) ---
  window.addEventListener('paste', async (e) => {
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
    
    const ab = getActiveArtboard();
    if(!ab) return;

    const clipboardData = e.clipboardData;
    if (!clipboardData) return;

    const items = Array.from(clipboardData.items || []);
    const imageItems = items.filter(it => it.type.startsWith('image/'));

    // 1. Direct Image Paste (Screenshots, direct files)
    if (imageItems.length > 0) {
      e.preventDefault();
      window.__clipboardTile = null; 
      let added = false;
      for(const it of imageItems){ 
        const f = it.getAsFile(); 
        if(f) {
          const { dataUrl } = await compressImage(f, 2400, 0.95);
          ab.tiles.push({ id: 't_' + generateId(), type: 'image', src: dataUrl, cropX: 50, cropY: 50 });
          added = true;
        }
      }
      if (added) {
        ab.selectedTileIndex = ab.tiles.length - 1;
        saveStateSnapshot(); markDirty(); renderStage(); toast("Image pasted");
      }
      return;
    }

    // 2. HTML Image Paste (Copying images from Google / Websites)
    if (clipboardData.types.includes('text/html')) {
      const html = clipboardData.getData('text/html');
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const img = doc.querySelector('img');
      
      if (img && img.src) {
        e.preventDefault();
        window.__clipboardTile = null;
        toast("Fetching image...");
        try {
          // Fetch directly to bypass CORS tainting
          const res = await fetch(img.src);
          const blob = await res.blob();
          const { dataUrl } = await compressImage(blob, 2400, 0.95);
          ab.tiles.push({ id: 't_' + generateId(), type: 'image', src: dataUrl, cropX: 50, cropY: 50 });
        } catch(err) {
          // Fallback to pure URL if CORS blocks standard fetch
          ab.tiles.push({ id: 't_' + generateId(), type: 'image', src: img.src, cropX: 50, cropY: 50 });
        }
        ab.selectedTileIndex = ab.tiles.length - 1;
        saveStateSnapshot(); markDirty(); renderStage();
        return;
      }
    }

    // 3. Fallback: Internal Clipboard Paste
    if (window.__clipboardTile) {
      e.preventDefault();
      const newTile = JSON.parse(JSON.stringify(window.__clipboardTile));
      newTile.id = 't_' + generateId();
      ab.tiles.push(newTile);
      ab.selectedTileIndex = ab.tiles.length - 1;
      renderStage(); saveStateSnapshot(); markDirty();
      toast("Tile pasted");
    }
  });

  // -------------------------------------------------------------
  // HISTORY
  // -------------------------------------------------------------
  function saveStateSnapshot() {
    if (isInternalChange) return;
    const tab = getTab();
    const snapshotObj = {
      name: tab.name, zoom: tab.zoom, panX: tab.panX, panY: tab.panY,
      activeArtboardId: tab.activeArtboardId, artboards: tab.artboards
    };
    const snapshot = JSON.stringify(snapshotObj);
    
    if (tab.undoStack.length === 0 || tab.undoStack[tab.undoStack.length - 1] !== snapshot) {
      tab.undoStack.push(snapshot);
      if (tab.undoStack.length > 30) tab.undoStack.shift();
      tab.redoStack = [];
      updateHistoryButtons();
    }
  }

  function updateHistoryButtons() {
    const tab = getTab();
    if(!tab) return;
    $('#undoBtn').disabled = tab.undoStack.length <= 1;
    $('#redoBtn').disabled = tab.redoStack.length === 0;
  }

  function undo() {
    const tab = getTab();
    if (tab.undoStack.length <= 1) return;
    const current = tab.undoStack.pop();
    tab.redoStack.push(current);
    const previous = tab.undoStack[tab.undoStack.length - 1];
    restoreSnapshot(previous); markDirty();
  }

  function redo() {
    const tab = getTab();
    if (tab.redoStack.length === 0) return;
    const next = tab.redoStack.pop();
    tab.undoStack.push(next);
    restoreSnapshot(next); markDirty();
  }

  function restoreSnapshot(jsonStr) {
    isInternalChange = true;
    const data = JSON.parse(jsonStr); const tab = getTab();
    tab.name = data.name; tab.activeArtboardId = data.activeArtboardId; tab.artboards = data.artboards;
    syncUIToActiveArtboard(); renderTabs(); renderStage(); updateHistoryButtons();
    isInternalChange = false;
  }

  function markDirty(){
    dirty = true; $('#saveState').textContent = 'Unsaved changes';
    $('#saveState').style.color = 'var(--text)'; $('#saveState').classList.add('dirty');
  }
  function markSaved(){
    dirty = false; $('#saveState').textContent = 'Saved';
    $('#saveState').style.color = 'var(--text-dim)'; $('#saveState').classList.remove('dirty');
  }

  let toastTimer;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  // -------------------------------------------------------------
  // HYBRID CLOUD ENGINE
  // -------------------------------------------------------------
  const DB_NAME = 'GoodBoardDB'; 
  const DB_STORE = 'projects';
  let dbInstance = null;

  async function getDB() {
    if (dbInstance) return dbInstance;
    return new Promise((resolve, reject) => {
      try {
        if (!window.indexedDB) return reject(new Error('No IDB'));
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        request.onsuccess = (e) => {
          dbInstance = e.target.result;
          dbInstance.onversionchange = () => { dbInstance.close(); dbInstance = null; };
          resolve(dbInstance);
        };
        request.onerror = () => reject(request.error || new Error('DB Error'));
        request.onblocked = () => reject(new Error('DB Blocked'));
      } catch (err) { reject(err); }
    });
  }

  async function storageSet(key, value) {
    let success = false;
    try {
      const db = await getDB();
      success = await new Promise((resolve) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        const store = tx.objectStore(DB_STORE);
        store.put(value, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      });
    } catch (e) {}

    try {
      const serialized = JSON.stringify(value);
      safeSetLocal(key, serialized);
      if (!success) success = true;
    } catch (err) {}
    return success;
  }

  async function storageGet(key) {
    let result = null;
    try {
      const db = await getDB();
      result = await new Promise((resolve) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const store = tx.objectStore(DB_STORE);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        tx.onabort = () => resolve(null);
      });
    } catch (e) { }

    if (result === null || result === undefined) {
      try {
        const item = safeGetLocal(key);
        if (item) {
          result = JSON.parse(item);
          storageSet(key, result).catch(()=>{});
        }
      } catch (err) {}
    }
    return result;
  }

  async function storageDelete(key) {
    try {
      const db = await getDB();
      await new Promise((resolve) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        const store = tx.objectStore(DB_STORE);
        store.delete(key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      });
    } catch (e) {}
    safeRemoveLocal(key);
  }

  async function getIndexRaw() {
    let list = await storageGet('gridwork-index');
    if (Array.isArray(list) && list.length > 0) return list;
    const item = safeGetLocal('gridwork-index');
    if (item) {
      try { return JSON.parse(item); } catch(e) {}
    }
    return [];
  }

  async function saveIndex(list) {
    await storageSet('gridwork-index', list);
    safeSetLocal('gridwork-index', JSON.stringify(list));
  }

  async function getAllSavedProjectSummaries() {
    const indexMap = new Map();
    const existing = await getIndexRaw();
    if (Array.isArray(existing)) {
      existing.forEach(p => { if (p && p.id) indexMap.set(p.id, p); });
    }

    try {
      const db = await getDB();
      await new Promise((resolve) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const store = tx.objectStore(DB_STORE);
        if (store.getAllKeys) {
          const req = store.getAllKeys();
          req.onsuccess = async () => {
            const keys = req.result || [];
            for (const k of keys) {
              if (typeof k === 'string' && k.startsWith('gridwork:') && k !== 'gridwork:undefined' && k !== 'gridwork-index') {
                const projId = k.replace('gridwork:', '');
                if (!indexMap.has(projId)) {
                  const projData = await storageGet(k);
                  if (projData) {
                    indexMap.set(projId, {
                      id: projId,
                      name: projData.name || 'Untitled Project',
                      updatedAt: projData.updatedAt || Date.now()
                    });
                  }
                }
              }
            }
            resolve();
          };
          req.onerror = () => resolve();
        } else resolve();
      });
    } catch(e) {}

    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('gridwork:') && k !== 'gridwork:undefined' && k !== 'gridwork-index') {
          const projId = k.replace('gridwork:', '');
          if (!indexMap.has(projId)) {
            try {
              const projData = JSON.parse(localStorage.getItem(k));
              if (projData) {
                indexMap.set(projId, { id: projId, name: projData.name || 'Untitled Project', updatedAt: projData.updatedAt || Date.now() });
              }
            } catch(err) {}
          }
        }
      }
    } catch(e) {}

    const finalList = Array.from(indexMap.values());
    await saveIndex(finalList);
    return finalList;
  }

  // -------------------------------------------------------------
  // FILE & TAB MANAGEMENT
  // -------------------------------------------------------------
  function centerViewport(tab){
    if(!stage.clientWidth || !stage.clientHeight) return;
    const ab = tab.artboards[0];
    tab.panX = (stage.clientWidth - (ab ? ab.boardW : 760)) / 2;
    tab.panY = (stage.clientHeight - (ab ? ab.boardH : 760)) / 2;
    if(isNaN(tab.panX)) tab.panX = 40; if(isNaN(tab.panY)) tab.panY = 40;
  }

  function addNewTab() {
    const p = createProject(`File ${appState.tabs.length + 1}`);
    p.activeArtboardId = p.artboards[0].id;
    centerViewport(p);
    appState.tabs.push(p); appState.activeTabId = p.id;
    isInternalChange = false; saveStateSnapshot(); refreshAppUI();
  }

  function closeTab(e, id) {
    e.stopPropagation();
    if(appState.tabs.length === 1) { toast("Cannot close the last file."); return; }
    const idx = appState.tabs.findIndex(t => t.id === id);
    appState.tabs.splice(idx, 1);
    if(appState.activeTabId === id) appState.activeTabId = appState.tabs[Math.max(0, idx - 1)].id;
    refreshAppUI();
  }

  function switchTab(id) {
    if(appState.activeTabId === id) return;
    appState.activeTabId = id; refreshAppUI();
  }

  function renderTabs() {
    tabBar.innerHTML = '';
    appState.tabs.forEach(tab => {
      const el = document.createElement('div');
      el.className = `tab ${appState.activeTabId === tab.id ? 'active' : ''}`;
      el.innerHTML = `<span>${tab.name}</span><button class="tab-close" title="Close File"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
      el.onclick = () => switchTab(tab.id);
      el.querySelector('.tab-close').onclick = (e) => closeTab(e, tab.id);
      tabBar.appendChild(el);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'add-tab-btn'; addBtn.textContent = '+ New File';
    addBtn.onclick = addNewTab; tabBar.appendChild(addBtn);
    $('#titleField').value = getTab().name;
  }

  $('#titleField').addEventListener('input', (e)=>{ getTab().name = e.target.value; renderTabs(); markDirty(); });

  async function saveProject(){
    const tab = getTab();
    if(!tab) return;
    if(!tab.projectId) tab.projectId = 'p_' + Date.now();

    const tabToSave = {
      name: tab.name || 'Untitled',
      projectId: tab.projectId,
      zoom: tab.zoom || 100,
      panX: tab.panX || 40,
      panY: tab.panY || 40,
      activeArtboardId: tab.activeArtboardId,
      artboards: tab.artboards.map(ab => ({ ...ab })),
      updatedAt: Date.now()
    };

    const ok = await storageSet('gridwork:' + tab.projectId, tabToSave);
    if(!ok){ toast('Storage failed! Save Local instead.'); return; }
    
    let idx = await getIndexRaw();
    if(!Array.isArray(idx)) idx = [];
    idx = idx.filter(p => p.id !== tab.projectId);
    idx.unshift({ id: tab.projectId, name: tab.name, updatedAt: Date.now() });
    await saveIndex(idx);

    markSaved(); toast('Saved to Cloud');
  }

  function saveProjectToDevice() {
    const data = getTab();
    const exportData = { ...data, undoStack: [], redoStack: [] };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `${(data.name || 'Saved').replace(/\s+/g,'-').toLowerCase()}.json`;
    a.click(); URL.revokeObjectURL(url); markSaved(); toast('File downloaded');
  }

  window.openDeviceFile = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const raw = JSON.parse(e.target.result);
        let migratedTab;
        if (raw.artboards && Array.isArray(raw.artboards)) { migratedTab = raw; } 
        else {
           migratedTab = createProject(raw.name || raw.projectName || 'Imported File');
           const ab = migratedTab.artboards[0];
           ab.columns = raw.columns ?? 3; ab.gap = raw.gap ?? 12; ab.radius = raw.radius ?? 0;
           ab.ratio = raw.ratio || '1/1'; ab.boardW = raw.boardW || 760; ab.boardH = raw.boardH || 760;
           ab.padding = raw.padding ?? 24; ab.bg = raw.bg || (isLightMode ? '#e5e5e5' : '#161616');
           ab.tiles = (raw.tiles || []).map(t => ({...t, type: t.type || 'image', cropX: t.cropX??50, cropY: t.cropY??50}));
        }
        migratedTab.id = 't_' + generateId(); 
        delete migratedTab.projectId; 
        
        migratedTab.artboards.forEach((ab, abIndex) => {
          if (typeof ab.x !== 'number' || isNaN(ab.x)) ab.x = abIndex * ((ab.boardW || 760) + 80);
          if (typeof ab.y !== 'number' || isNaN(ab.y)) ab.y = 0;
          normalizeArtboard(ab);
        });

        if(migratedTab.artboards.length > 0) migratedTab.activeArtboardId = migratedTab.artboards[0].id;
        migratedTab.undoStack = []; migratedTab.redoStack = [];
        appState.tabs.push(migratedTab); appState.activeTabId = migratedTab.id;
        refreshAppUI(); saveStateSnapshot(); toast('File opened successfully');
      } catch (err) { toast('Error: Invalid file format'); }
    };
    reader.readAsText(file); event.target.value = ''; 
  }

  async function loadProject(id){
    closeAllMenus();
    const existingTab = appState.tabs.find(t => t.projectId === id || t.id === id);
    if(existingTab) { switchTab(existingTab.id); toast('Switched to open tab'); return; }

    let data = await storageGet('gridwork:' + id);
    if (!data) data = await storageGet(id);
    if (!data) { toast('Could not open project.'); return; }
    
    let newTab;
    if (!data.artboards || !Array.isArray(data.artboards)) {
      newTab = createProject(data.name || data.projectName || 'Project');
      newTab.projectId = id;
      const ab = newTab.artboards[0];
      ab.columns = data.columns ?? 3; ab.gap = data.gap ?? 12; ab.radius = data.radius ?? 0;
      ab.ratio = data.ratio || '1/1'; ab.boardW = data.boardW || 760; ab.boardH = data.boardH || 760;
      ab.padding = data.padding ?? 24; ab.bg = data.bg || (isLightMode ? '#e5e5e5' : '#161616');
      ab.tiles = (data.tiles || []).map(t => ({...t, type: t.type || 'image', cropX: t.cropX ?? 50, cropY: t.cropY ?? 50}));
    } else {
      newTab = { ...data, id: 't_' + generateId(), projectId: id, undoStack: [], redoStack: [] };
    }

    newTab.artboards.forEach((ab, abIndex) => {
      if (typeof ab.x !== 'number' || isNaN(ab.x)) ab.x = abIndex * ((ab.boardW || 760) + 80);
      if (typeof ab.y !== 'number' || isNaN(ab.y)) ab.y = 0;
      if (!ab.tiles) ab.tiles = [];
      normalizeArtboard(ab);
    });

    if (newTab.artboards.length > 0) {
      if (!newTab.activeArtboardId || !newTab.artboards.some(a => a.id === newTab.activeArtboardId)) {
        newTab.activeArtboardId = newTab.artboards[0].id;
      }
    }

    centerViewport(newTab);
    appState.tabs.push(newTab); appState.activeTabId = newTab.id;
    refreshAppUI(); saveStateSnapshot(); toast('Project loaded');
  }

  async function deleteProject(id){
    await storageDelete('gridwork:' + id);
    await storageDelete(id);
    
    let idx = await getIndexRaw();
    if(Array.isArray(idx)) { idx = idx.filter(p => p.id !== id); await saveIndex(idx); }
    
    const openIdx = appState.tabs.findIndex(t => t.projectId === id);
    if (openIdx !== -1) {
      if(appState.tabs.length === 1) { addNewTab(); appState.tabs.splice(0, 1); } 
      else {
        appState.tabs.splice(openIdx, 1);
        if (appState.activeTabId === appState.tabs[openIdx]?.id || !appState.tabs.find(t => t.id === appState.activeTabId)) {
          appState.activeTabId = appState.tabs[0].id;
        }
        refreshAppUI();
      }
    }
    await refreshProjectsMenu();
  }

  // -------------------------------------------------------------
  // GLOBAL CONTEXT TOOLS DOCK
  // -------------------------------------------------------------
  function syncContextTools() {
    const ab = getActiveArtboard();
    const dock = $('#contextToolsDock');
    
    if (!ab || ab.selectedTileIndex === null) {
      dock.style.display = 'none';
      return;
    }

    const tile = ab.tiles[ab.selectedTileIndex];
    
    if (tile.type === 'text') {
      dock.style.display = 'flex';
      
      $('#ttBgColor').style.backgroundColor = tile.bg || '#fef2a0';
      $('#ttTextColor').style.backgroundColor = tile.color || '#111111';
      
      $('#ttFsVal').textContent = tile.fontSize || 28;
    } 
    else {
      dock.style.display = 'none';
    }
  }

  // Bind Context Dock Events
  $('#contextToolsDock').addEventListener('mousedown', e => e.stopPropagation());
  $('#contextToolsDock').addEventListener('click', e => e.stopPropagation());

  // Text Alignment Handlers
  const alignText = (align) => {
    const t = getSelectedTile(); if (!t || t.tile.type !== 'text') return;
    t.tile.textAlign = align;
    const tileEl = document.querySelectorAll(`#board_${t.ab.id} .tile`)[t.index];
    if (tileEl) {
       const layer = tileEl.querySelector('.text-tile-layer');
       if (layer) layer.style.textAlign = align;
    }
    markDirty(); saveStateSnapshot();
  };
  $('#ttAlignLeft').onclick = (e) => { e.stopPropagation(); alignText('left'); };
  $('#ttAlignCenter').onclick = (e) => { e.stopPropagation(); alignText('center'); };
  $('#ttAlignRight').onclick = (e) => { e.stopPropagation(); alignText('right'); };

  // Text Font Size Handlers
  const setFontSize = (val) => {
    const t = getSelectedTile(); if (!t || t.tile.type !== 'text') return;
    t.tile.fontSize = Math.max(8, Math.min(200, val));
    $('#ttFsVal').textContent = t.tile.fontSize;
    const tileEl = document.querySelectorAll(`#board_${t.ab.id} .tile`)[t.index];
    if (tileEl) {
       const layer = tileEl.querySelector('.text-tile-layer');
       if (layer) layer.style.fontSize = t.tile.fontSize + 'px';
    }
    markDirty(); saveStateSnapshot();
  };
  $('#ttFsMinus').onclick = (e) => { e.stopPropagation(); const t = getSelectedTile(); if(t) setFontSize((t.tile.fontSize || 28) - 2); };
  $('#ttFsPlus').onclick = (e) => { e.stopPropagation(); const t = getSelectedTile(); if(t) setFontSize((t.tile.fontSize || 28) + 2); };

  // Text Color Pickers Triggering Custom Menu
  $('#ttBgColor').onclick = (e) => {
    e.stopPropagation();
    const t = getSelectedTile(); if (!t || t.tile.type !== 'text') return;
    openColorPicker(e.clientX, e.clientY, t.tile.bg, (hex) => {
      t.tile.bg = hex;
      $('#ttBgColor').style.backgroundColor = hex;
      const tileEl = document.querySelectorAll(`#board_${t.ab.id} .tile`)[t.index];
      if (tileEl) tileEl.style.backgroundColor = hex;
      markDirty();
    }, () => saveStateSnapshot());
  };

  $('#ttTextColor').onclick = (e) => {
    e.stopPropagation();
    const t = getSelectedTile(); if (!t || t.tile.type !== 'text') return;
    openColorPicker(e.clientX, e.clientY, t.tile.color, (hex) => {
      t.tile.color = hex;
      $('#ttTextColor').style.backgroundColor = hex;
      const tileEl = document.querySelectorAll(`#board_${t.ab.id} .tile`)[t.index];
      if (tileEl) {
         const layer = tileEl.querySelector('.text-tile-layer');
         if (layer) layer.style.color = hex;
      }
      markDirty();
    }, () => saveStateSnapshot());
  };

  // -------------------------------------------------------------
  // RENDERING & INTERACTION (FREE DRAG ARTBOARDS)
  // -------------------------------------------------------------
  function refreshAppUI() {
    const tab = getTab();
    if (!tab) return;
    if (tab.artboards.length > 0) {
      if (!tab.activeArtboardId || !tab.artboards.some(a => a.id === tab.activeArtboardId)) {
        tab.activeArtboardId = tab.artboards[0].id;
      }
    }
    renderTabs(); syncUIToActiveArtboard(); renderStage(); updateHistoryButtons();
  }

  function updateTransform(){
    const tab = getTab();
    if(!tab) return;
    viewportCanvas.style.transform = `translate(${tab.panX}px, ${tab.panY}px) scale(${tab.zoom / 100})`;
  }

  function setActiveArtboard(abId) {
    const tab = getTab();
    if (tab.activeArtboardId === abId) return;
    tab.activeArtboardId = abId;
    syncUIToActiveArtboard(); renderStage(); 
  }

  let isDraggingArtboard = false;
  let draggedArtboardId = null;
  let abDragStartX = 0, abDragStartY = 0;
  let abBaseX = 0, abBaseY = 0;

  function renderStage(){
    const tab = getTab();
    updateTransform();
    viewportCanvas.innerHTML = '';
    
    tab.artboards.forEach((ab, abIndex) => {
      if (typeof ab.x !== 'number' || isNaN(ab.x)) ab.x = abIndex * ((ab.boardW || 760) + 80);
      if (typeof ab.y !== 'number' || isNaN(ab.y)) ab.y = 0;

      const wrapper = document.createElement('div');
      wrapper.className = `artboard-wrapper ${tab.activeArtboardId === ab.id ? 'active' : ''}`;
      wrapper.id = `wrapper_${ab.id}`;
      wrapper.style.transform = `translate(${ab.x}px, ${ab.y}px)`;
      wrapper.onmousedown = (e) => {
        if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') setActiveArtboard(ab.id);
      };

      const header = document.createElement('div');
      header.className = 'artboard-header';
      
      header.onmousedown = (e) => {
         if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
         e.stopPropagation(); 
         isDraggingArtboard = true;
         draggedArtboardId = ab.id;
         abDragStartX = e.clientX;
         abDragStartY = e.clientY;
         abBaseX = ab.x;
         abBaseY = ab.y;
         setActiveArtboard(ab.id);
      };

      const titleInput = document.createElement('input');
      titleInput.className = 'artboard-title'; titleInput.value = ab.name;
      titleInput.onchange = (e) => { ab.name = e.target.value; saveStateSnapshot(); markDirty(); };
      
      const delBtn = document.createElement('button');
      delBtn.className = 'artboard-delete'; delBtn.innerHTML = 'Delete';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if(tab.artboards.length === 1) { toast('Need at least one artboard'); return; }
        if(confirm(`Delete ${ab.name}?`)) {
          tab.artboards.splice(abIndex, 1);
          if(tab.activeArtboardId === ab.id) tab.activeArtboardId = tab.artboards[0].id;
          saveStateSnapshot(); refreshAppUI(); markDirty();
        }
      };

      header.appendChild(titleInput); header.appendChild(delBtn); wrapper.appendChild(header);

      const boardDOM = document.createElement('div');
      boardDOM.className = 'board'; boardDOM.id = `board_${ab.id}`;
      boardDOM.style.setProperty('grid-template-columns', `repeat(${ab.columns}, minmax(0, 1fr))`);
      boardDOM.style.setProperty('gap', ab.gap + 'px');
      boardDOM.style.setProperty('padding', ab.padding + 'px');
      boardDOM.style.setProperty('background', ab.bg);
      boardDOM.style.width = ab.boardW + 'px';
      boardDOM.style.minHeight = ab.boardH + 'px';

      boardDOM.addEventListener('dragover', e => { 
        e.preventDefault(); 
        const isCopy = e.altKey || isAltPressed;
        e.dataTransfer.dropEffect = isCopy ? 'copy' : 'move';
        if(Array.from(e.dataTransfer.types).includes('Files')) { boardDOM.style.borderColor = 'var(--accent)'; }
      });
      boardDOM.addEventListener('dragleave', e => { boardDOM.style.borderColor = 'transparent'; });
      
      boardDOM.addEventListener('drop', async e => {
        e.preventDefault(); boardDOM.style.borderColor = 'transparent';
        
        const dataStr = e.dataTransfer.getData('text/plain');
        if(dataStr) {
            try {
                const data = JSON.parse(dataStr);
                const sourceAB = tab.artboards.find(a => a.id === data.sourceArtboardId);
                if(sourceAB) {
                    const isCopy = e.altKey || isAltPressed || e.dataTransfer.dropEffect === 'copy';
                    if (isCopy) {
                        const cloned = JSON.parse(JSON.stringify(sourceAB.tiles[data.tileIndex]));
                        cloned.id = 't_' + generateId();
                        ab.tiles.push(cloned);
                        ab.selectedTileIndex = ab.tiles.length - 1;
                        setActiveArtboard(ab.id);
                        saveStateSnapshot(); markDirty(); renderStage();
                        toast("Tile duplicated");
                    } else if (sourceAB.id !== ab.id) {
                        const [moved] = sourceAB.tiles.splice(data.tileIndex, 1);
                        ab.tiles.push(moved);
                        ab.selectedTileIndex = ab.tiles.length - 1;
                        setActiveArtboard(ab.id);
                        saveStateSnapshot(); markDirty(); renderStage();
                    } else {
                        const [moved] = sourceAB.tiles.splice(data.tileIndex, 1);
                        ab.tiles.push(moved);
                        ab.selectedTileIndex = ab.tiles.length - 1;
                        setActiveArtboard(ab.id);
                        saveStateSnapshot(); markDirty(); renderStage();
                    }
                }
            } catch(err) {}
            return;
        }

        if(Array.from(e.dataTransfer.types).includes('Files')){
          const files = Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
          if(files.length){
            for(const f of files) {
              const { dataUrl } = await compressImage(f, 2400, 0.95);
              ab.tiles.push({ id: 't_' + generateId(), type: 'image', src: dataUrl, cropX: 50, cropY: 50 });
            }
            setActiveArtboard(ab.id); saveStateSnapshot(); markDirty(); renderStage();
          }
        }
      });

      if(ab.tiles.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty-state'; empty.style.gridColumn = `1 / -1`;
        empty.innerHTML = `<div class="big">Empty Artboard</div><div style="font-size: 11px;">Select and use Dock + buttons</div>`;
        boardDOM.appendChild(empty);
      } else {
        const canSpan = ab.columns > 1;

        // --- FIXED GRID MATH TO PREVENT HERO/BENTO ZERO-HEIGHT COLLAPSE ---
        const availableW = ab.boardW - (ab.padding * 2);
        const colW = Math.max(1, (availableW - (ab.gap * (ab.columns - 1))) / ab.columns);
        const ratioParts = (ab.ratio || '1/1').split('/');
        const rW = parseFloat(ratioParts[0]) || 1;
        const rH = parseFloat(ratioParts[1]) || 1;
        const rowH = colW * (rH / rW);
        // Compute exact double block aspect ratio so it spans perfectly
        const span2Ratio = `${(colW * 2) + ab.gap} / ${(rowH * 2) + ab.gap}`;
        
        ab.tiles.forEach((tile, i) => {
          const el = document.createElement('div');
          el.className = 'tile'; el.draggable = true;
          el.style.borderRadius = ab.radius + 'px';
          
          if (ab.selectedTileIndex === i) el.classList.add('is-selected');

          if (ab.template === 'featured' && i === 0) { 
             el.style.gridColumn = '1 / -1'; 
             el.style.aspectRatio = '21/9'; 
             el.style.height = 'auto';
          } 
          else if (ab.template === 'hero' && i === 0 && canSpan) { 
             el.style.gridColumn = 'span 2'; 
             el.style.gridRow = 'span 2'; 
             el.style.aspectRatio = span2Ratio; 
             el.style.height = 'auto'; 
          } 
          else if (ab.template === 'bento' && (i % 5 === 0) && canSpan) { 
             el.style.gridColumn = 'span 2'; 
             el.style.gridRow = 'span 2'; 
             el.style.aspectRatio = span2Ratio; 
             el.style.height = 'auto'; 
          } 
          else { 
             el.style.gridColumn = 'span 1'; 
             el.style.gridRow = 'span 1'; 
             el.style.aspectRatio = ab.ratio; 
             el.style.height = 'auto'; 
          }

          if (tile.type === 'color') {
            el.style.background = tile.hex || '#e5e5e5';
            const badge = document.createElement('div'); badge.className = 'color-tile-badge';
            badge.textContent = (tile.hex || '#e5e5e5').toUpperCase();
            
            const layer = document.createElement('div'); layer.className = 'color-tile-layer';
            layer.onclick = (e) => {
              if(e.target.closest('.remove')) return;
              e.stopPropagation();
              openColorPicker(e.clientX, e.clientY, tile.hex, (hex) => {
                tile.hex = hex;
                el.style.background = tile.hex;
                badge.textContent = tile.hex.toUpperCase();
                markDirty();
              }, () => saveStateSnapshot());
            };

            layer.appendChild(badge);
            el.appendChild(layer);
          } else if (tile.type === 'text') {
            el.style.background = tile.bg || '#fef2a0';

            const textLayer = document.createElement('div');
            textLayer.className = 'text-tile-layer';
            textLayer.contentEditable = 'false';
            textLayer.spellcheck = false;
            textLayer.style.fontSize = (tile.fontSize || 28) + 'px';
            textLayer.style.color = tile.color || '#111111';
            textLayer.style.textAlign = tile.textAlign || 'center';
            textLayer.textContent = tile.text || '';

            textLayer.addEventListener('mousedown', (e) => {
              if (textLayer.contentEditable === 'true') {
                e.stopPropagation();
              }
              ab.selectedTileIndex = i;
              document.querySelectorAll('.tile').forEach(t => t.classList.remove('is-selected'));
              el.classList.add('is-selected');
              syncContextTools();
            });
            textLayer.addEventListener('dblclick', (e) => {
              e.stopPropagation();
              textLayer.contentEditable = 'true';
              textLayer.focus();
            });
            textLayer.addEventListener('focus', () => { el.draggable = false; });
            textLayer.addEventListener('blur', () => {
              textLayer.contentEditable = 'false';
              el.draggable = true; tile.text = textLayer.textContent;
              markDirty(); saveStateSnapshot();
            });
            textLayer.addEventListener('input', () => { tile.text = textLayer.textContent; markDirty(); });

            el.appendChild(textLayer);
          } else {
            const imgLayer = document.createElement('div'); imgLayer.className = 'img-layer';
            imgLayer.style.backgroundImage = `url(${tile.src})`;
            imgLayer.style.backgroundPosition = `${tile.cropX}% ${tile.cropY}%`;
            el.appendChild(imgLayer);
          }

          const rm = document.createElement('button'); rm.className = 'remove';
          rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>';
          rm.onclick = (e) => { 
            e.stopPropagation(); ab.tiles.splice(i,1); 
            if(ab.selectedTileIndex === i) ab.selectedTileIndex = null;
            saveStateSnapshot(); markDirty(); renderStage(); syncContextTools();
          };
          el.appendChild(rm);

          el.addEventListener('mousedown', (e) => {
            if(e.target.closest('.remove') || e.target.closest('.color-tile-layer') || e.button === 2) return;
            ab.selectedTileIndex = i;
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('is-selected'));
            el.classList.add('is-selected');
            syncContextTools();
          });

          el.addEventListener('contextmenu', (e) => {
            e.preventDefault(); e.stopPropagation();
            ab.selectedTileIndex = i;
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('is-selected'));
            el.classList.add('is-selected');
            selectedContextData = { artboardId: ab.id, tileIndex: i };
            syncContextTools();

            let x = e.clientX; let y = e.clientY;
            if (x + 150 > window.innerWidth) x -= 150;
            if (y + 80 > window.innerHeight) y -= 80;
            contextMenu.style.left = `${x}px`; contextMenu.style.top = `${y}px`;
            contextMenu.classList.add('open');
          });

          el.addEventListener('dragstart', (e)=>{ 
            e.dataTransfer.setData('text/plain', JSON.stringify({sourceArtboardId: ab.id, tileIndex: i})); 
            e.dataTransfer.effectAllowed = 'copyMove';
            el.classList.add('dragging');
          });
          el.addEventListener('dragend', ()=> el.classList.remove('dragging') );
          
          el.addEventListener('dragover', (e)=>{ 
            e.preventDefault(); 
            const isCopy = e.altKey || isAltPressed;
            e.dataTransfer.dropEffect = isCopy ? 'copy' : 'move';
            el.classList.add('drag-over'); 
          });
          el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
          
          el.addEventListener('drop', (e)=>{
            e.preventDefault(); e.stopPropagation();
            el.classList.remove('drag-over');
            const dataStr = e.dataTransfer.getData('text/plain');
            if(!dataStr) return;
            const data = JSON.parse(dataStr);
            
            const sourceAB = tab.artboards.find(a => a.id === data.sourceArtboardId);
            if(sourceAB) {
              const isCopy = e.altKey || isAltPressed || e.dataTransfer.dropEffect === 'copy';
              if (isCopy) {
                 const cloned = JSON.parse(JSON.stringify(sourceAB.tiles[data.tileIndex]));
                 cloned.id = 't_' + generateId();
                 ab.tiles.splice(i, 0, cloned);
                 toast("Tile duplicated");
              } else {
                 const [moved] = sourceAB.tiles.splice(data.tileIndex, 1);
                 let dropIndex = i;
                 if (sourceAB.id === ab.id && data.tileIndex < i) dropIndex = i; 
                 ab.tiles.splice(dropIndex, 0, moved);
              }
              ab.selectedTileIndex = i;
              setActiveArtboard(ab.id);
              saveStateSnapshot(); markDirty(); renderStage(); syncContextTools();
            }
          });

          if(tile.type === 'image') {
            let isCropping = false; let startX = 0, startY = 0;
            el.addEventListener('mousedown', (e) => {
              if(e.target.closest('.remove') || e.button === 2) return;
              if(e.shiftKey) {
                ab.selectedTileIndex = i;
                isCropping = true; el.draggable = false; el.classList.add('cropping');
                startX = e.clientX; startY = e.clientY; e.stopPropagation();
              }
            });
            window.addEventListener('mousemove', (e) => {
              if(!isCropping) return;
              const dx = e.clientX - startX; const dy = e.clientY - startY;
              startX = e.clientX; startY = e.clientY;
              tile.cropX = Math.max(0, Math.min(100, tile.cropX - dx * 0.25));
              tile.cropY = Math.max(0, Math.min(100, tile.cropY - dy * 0.25));
              el.querySelector('.img-layer').style.backgroundPosition = `${tile.cropX}% ${tile.cropY}%`;
              markDirty();
            });
            window.addEventListener('mouseup', () => {
              if(isCropping){ isCropping = false; el.draggable = true; el.classList.remove('cropping'); saveStateSnapshot(); }
            });
          }
          boardDOM.appendChild(el);
        });
      }
      wrapper.appendChild(boardDOM);
      viewportCanvas.appendChild(wrapper);
    });
    
    syncContextTools();
  }

  function syncUIToActiveArtboard(){
    const ab = getActiveArtboard();
    if(!ab) return;
    $('#templateSelect').value = ab.template;
    $('#colsValStepper').textContent = ab.columns;
    $('#gapRange').value = ab.gap; $('#gapVal').textContent = ab.gap;
    $('#radiusRange').value = ab.radius; $('#radiusVal').textContent = ab.radius;
    $('#padRange').value = ab.padding; $('#padVal').textContent = ab.padding;

    if (RATIO_PRESETS.includes(ab.ratio)) {
      $('#ratioSelect').value = ab.ratio;
      $('#customRatioRow').style.display = 'none';
    } else {
      $('#ratioSelect').value = 'custom';
      $('#customRatioRow').style.display = 'flex';
      const [rw, rh] = (ab.ratio || '1/1').split('/');
      $('#customRatioW').value = rw; $('#customRatioH').value = rh;
    }

    const presetKey = ab.boardW + 'x' + ab.boardH;
    const presetOpts = Array.from($('#presetSelect').options).map(o=>o.value).filter(v => v !== 'custom');
    if(!ab.customSize && presetOpts.includes(presetKey)){
      $('#presetSelect').value = presetKey;
      $('#customSizeRow').style.display = 'none';
    } else {
      $('#presetSelect').value = 'custom';
      $('#customSizeRow').style.display = 'flex';
      $('#customW').value = ab.boardW;
      $('#customH').value = ab.boardH;
    }
    document.querySelectorAll('.swatch[data-color]').forEach(sw=>{
      sw.classList.toggle('active', sw.dataset.color.toLowerCase() === ab.bg.toLowerCase());
    });
  }
